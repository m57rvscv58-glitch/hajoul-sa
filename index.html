
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>HAJOUL WORLD</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07111d;color:white;font-family:Arial,sans-serif;text-align:center}
header{padding:18px;background:#101e30}
h1{margin:0;color:#38d9ff;letter-spacing:3px}
#stats{display:flex;justify-content:space-around;padding:12px;background:#17283b;font-weight:bold}
canvas{display:block;width:100%;height:52vh;background:#182b25;touch-action:none}
.panel{padding:12px}
select,button{padding:12px;border:0;border-radius:10px;font-size:16px;margin:5px}
button{background:#13bce5;color:#001522;font-weight:bold}
#controls{display:flex;justify-content:center;gap:15px;padding:12px}
#controls button{width:90px;height:65px;font-size:25px}
small{color:#9cb4c9}
</style>
</head>
<body>
<header>
<h1>HAJOUL WORLD</h1>
<small>DRIVE • DRIFT • EXPLORE</small>
</header>
<div id="stats">
<span>Speed: <b id="speed">0</b> km/h</span>
<span>Fuel: <b id="fuel">100</b>%</span>
</div>
<div class="panel">
<select id="car">
<option value="Patrol">Nissan Patrol</option>
<option value="Hilux">Toyota Hilux</option>
<option value="Sonata">Hyundai Sonata</option>
<option value="Accent">Hyundai Accent</option>
<option value="Cybertruck">Tesla Cybertruck</option>
<option value="Model S">Tesla Model S Plaid</option>
<option value="GT-R">Nissan GT-R</option>
<option value="Porsche">Porsche 911</option>
<option value="Lamborghini">Lamborghini</option>
<option value="Ferrari">Ferrari</option>
</select>
<button onclick="refuel()">⛽ REFUEL</button>
</div>
<canvas id="game"></canvas>
<div id="controls">
<button id="left">⬅️</button>
<button id="gas">🚀</button>
<button id="right">➡️</button>
</div>
<button onclick="start()">START GAME</button>
<p id="message">Choose your car and start driving!</p>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
let speed=0,fuel=100,x=0,playing=false,turn=0;
function resize(){
c.width=c.clientWidth*devicePixelRatio;
c.height=c.clientHeight*devicePixelRatio;
ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
resize();window.addEventListener('resize',resize);
function start(){playing=true;document.getElementById('message').textContent='Enjoy the ride!';}
function refuel(){fuel=100;document.getElementById('fuel').textContent='100';}
function hold(id,fn){
let b=document.getElementById(id);
b.addEventListener('pointerdown',e=>{e.preventDefault();fn(true)});
['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>fn(false)));
}
let gas=false,left=false,right=false;
hold('gas',v=>gas=v);
hold('left',v=>left=v);
hold('right',v=>right=v);
function draw(){
let w=c.clientWidth,h=c.clientHeight;
ctx.clearRect(0,0,w,h);
ctx.fillStyle='#24452e';ctx.fillRect(0,0,w,h);
ctx.fillStyle='#343b45';ctx.beginPath();
ctx.moveTo(w*.25,0);ctx.lineTo(w*.75,0);ctx.lineTo(w*.95,h);ctx.lineTo(w*.05,h);ctx.fill();
ctx.strokeStyle='#eee';ctx.setLineDash([25,25]);ctx.lineWidth=4;
ctx.beginPath();ctx.moveTo(w/2,0);ctx.lineTo(w/2,h);ctx.stroke();ctx.setLineDash([]);
let car=document.getElementById('car').value;
ctx.save();ctx.translate(w/2+x,h*.72);
ctx.fillStyle='#111';ctx.fillRect(-24,-44,48,90);
ctx.fillStyle='#18bce8';ctx.fillRect(-19,-42,38,75);
ctx.fillStyle='#aeeaff';ctx.fillRect(-15,-32,30,18);
ctx.fillStyle='#ffdf68';ctx.fillRect(-16,25,10,7);ctx.fillRect(6,25,10,7);
ctx.fillStyle='white';ctx.font='bold 12px Arial';ctx.textAlign='center';ctx.fillText(car,0,52);
ctx.restore();
if(playing){
if(gas&&fuel>0){speed=Math.min(240,speed+1.1);fuel=Math.max(0,fuel-.025);}
else speed=Math.max(0,speed-.5);
if(left)x=Math.max(-w*.2,x-3);
if(right)x=Math.min(w*.2,x+3);
}
document.getElementById('speed').textContent=Math.round(speed);
document.getElementById('fuel').textContent=Math.round(fuel);
if(fuel===0){document.getElementById('message').textContent='Out of fuel! Refuel to continue.';playing=false;}
requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
