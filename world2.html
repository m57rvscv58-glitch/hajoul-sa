
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>HAJOUL WORLD ULTRA 2.0</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#101722;color:white;font-family:Arial}
canvas{display:block}
#ui{position:fixed;inset:0;pointer-events:none}
.panel{background:#101a29dd;border:1px solid #ffffff35;border-radius:13px;padding:10px 14px}
.top{display:flex;justify-content:space-between;padding:13px}
.logo{font-size:20px;font-weight:900;letter-spacing:2px;color:#55d9ff}
#speed{font-size:28px;font-weight:bold;text-align:center}
#status{font-size:10px;color:#b8d7e8;margin-top:5px}
.tools{position:absolute;right:12px;top:85px;display:grid;gap:7px}
button{pointer-events:auto;background:#13283fdf;color:white;border:1px solid #ffffff55;border-radius:12px;padding:11px;font-weight:bold}
button:active{background:#078ac6}
.controls{position:absolute;bottom:20px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px}
.group{display:flex;gap:9px;align-items:end}
.control{width:67px;height:67px;font-size:23px}
#gas{width:85px;height:85px;background:#087eb9}
#brake{background:#a52c36}
</style>
</head>
<body>
<div id="ui">
 <div class="top">
  <div class="panel"><div class="logo">HAJOUL WORLD</div><div id="status">ULTRA 2.0 • OPEN CITY</div></div>
  <div class="panel"><div id="speed">0</div><small>KM/H</small></div>
 </div>
 <div class="tools">
  <button id="sun">☀️ Sunny</button>
  <button id="cloud">☁️ Clouds</button>
  <button id="rain">🌧 Rain</button>
  <button id="night">🌙 Night</button>
  <button id="drift">💨 Drift: OFF</button>
  <button id="reset">↻ Reset</button>
 </div>
 <div class="controls">
  <div class="group"><button class="control" id="left">◀</button><button class="control" id="right">▶</button></div>
  <div class="group"><button class="control" id="brake">▼</button><button class="control" id="gas">▲</button></div>
 </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8cc9ed);
scene.fog=new THREE.Fog(0x8cc9ed,100,650);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,1200);
camera.position.set(0,5,12);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xc7e7ff,0x6b5942,2));
const sunLight=new THREE.DirectionalLight(0xffedcf,3);
sunLight.position.set(-80,130,60);
sunLight.castShadow=true;
sunLight.shadow.mapSize.set(2048,2048);
scene.add(sunLight);

const material=(c,r=.7,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const ground=material(0xb39b72);
const asphalt=material(0x252a31,.95);
const white=material(0xffffff);
const black=material(0x10151b,.5);
const chrome=material(0xbac5ce,.25,.85);
const windowMat=material(0x183b50,.18,.5);
const red=material(0xd21d28,.3);
const yellow=material(0xffd34e);

function cube(parent,x,y,z,sx,sy,sz,mat){
 const o=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat);
 o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o;
}

cube(scene,0,-.35,-150,1000,.5,1000,ground);
cube(scene,0,-.04,-150,20,.18,1000,asphalt);
for(let z=30;z>-650;z-=18)cube(scene,0,.06,z,.22,.03,7,white);
for(let x of [-10,10])cube(scene,x,.05,-150,.3,.15,1000,yellow);

// American city buildings
for(let z=20;z>-620;z-=28){
 for(let side of [-1,1]){
  const h=18+Math.random()*65,w=10+Math.random()*15;
  const x=side*(20+Math.random()*20),depth=12+Math.random()*12;
  cube(scene,x,h/2-.1,z+Math.random()*12,w,h,depth,
   material(new THREE.Color().setHSL(.57+Math.random()*.08,.18,.2+Math.random()*.2)));
  for(let y=4;y<h-3;y+=5){
   for(let wx=-1;wx<=1;wx++){
    cube(scene,x+wx*w*.24,y,z-depth/2-.08,w*.12,.9,.1,
     new THREE.MeshStandardMaterial({color:0x8ed9ed,emissive:0x173b4c,emissiveIntensity:.35}));
   }
  }
 }
}

// Street lights
for(let z=15;z>-600;z-=45){
 for(let side of [-1,1]){
  const x=side*12;
  cube(scene,x,3,z,.18,6,.18,black);
  cube(scene,x-side*1.2,5.8,z,2.5,.15,.15,black);
  const lamp=cube(scene,x-side*2.2,5.7,z,.7,.18,.5,material(0xffedb0,.3));
  lamp.material.emissive=new THREE.Color(0x665522);
 }
}

// Traffic signals
const signals=[];
for(let z=-35;z>-550;z-=100){
 for(let side of [-1,1]){
  const x=side*9;
  cube(scene,x,3,z,.18,6,.18,black);
  cube(scene,x,5.5,z,.8,1.9,.55,black);
  const lights=[];
  for(let j=0;j<3;j++){
   const color=[0xff2020,0xffc72c,0x24db65][j];
   const l=new THREE.Mesh(new THREE.SphereGeometry(.19,12,10),
    new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:j===2?1:.08}));
   l.position.set(x,6.1-j*.55,z+.3);scene.add(l);lights.push(l);
  }
  signals.push(lights);
 }
}

// Main Nissan Patrol-inspired SUV
const car=new THREE.Group();scene.add(car);car.position.set(0,0,3);
const blue=material(0x123f83,.28,.65);
const body=cube(car,0,1.05,0,2.4,1.05,4.5,blue);
cube(car,0,1.85,-.35,2.05,1.05,2.5,blue);
cube(car,0,1.9,-.35,1.9,.78,2.35,windowMat);

// Hood, bumpers and grille
cube(car,0,1.58,1.25,2.22,.13,1.35,blue);
cube(car,0,.64,2.3,2.35,.35,.2,chrome);
cube(car,0,.95,2.29,1.15,.48,.09,black);
for(let y=.79;y<1.15;y+=.11)cube(car,0,y,2.35,1.05,.025,.035,chrome);
cube(car,0,.57,-2.28,2.3,.35,.2,black);

// Mirrors, handles and lights
for(const side of [-1,1]){
 cube(car,side*1.18,1.8,.65,.4,.22,.35,blue);
 cube(car,side*1.28,1.15,-.35,.07,.09,.35,chrome);
 cube(car,side*.87,1.04,2.32,.48,.32,.1,material(0xfff4d2,.2));
 cube(car,side*.88,1.04,-2.32,.48,.3,.1,red);
 cube(car,side*1.21,1.42,-.1,.08,.45,black);
}

// Roof rails
for(const side of [-1,1]){
 cube(car,side*.82,2.43,-.3,.09,.08,2.3,chrome);
 cube(car,side*.82,2.35,-1.3,.09,.12,.12,black);
 cube(car,side*.82,2.35,.7,.09,.12,.12,black);
}

// Wheels with detailed rims
const wheels=[];
for(const x of [-1.23,1.23]){
 for(const z of [-1.48,1.48]){
  const wheel=new THREE.Group();wheel.position.set(x,.57,z);car.add(wheel);
  const tire=new THREE.Mesh(new THREE.CylinderGeometry(.55,.55,.36,28),black);
  tire.rotation.z=Math.PI/2;wheel.add(tire);
  const rim=new THREE.Mesh(new THREE.CylinderGeometry(.34,.34,.38,24),chrome);
  rim.rotation.z=Math.PI/2;wheel.add(rim);
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,.4,16),black);
  hub.rotation.z=Math.PI/2;wheel.add(hub);
  for(let a=0;a<8;a++){
   const angle=a*Math.PI/4;
   const spoke=cube(wheel,0,Math.cos(angle)*.22,Math.sin(angle)*.22,.4,.055,.055,chrome);
   spoke.rotation.x=angle;
  }
  wheels.push(wheel);
 }
}

// Clouds
const clouds=new THREE.Group();scene.add(clouds);
for(let i=0;i<35;i++){
 const g=new THREE.Group();
 for(let j=0;j<5;j++){
  const m=new THREE.Mesh(new THREE.SphereGeometry(3+Math.random()*3,12,10),material(0xe7eff5));
  m.position.set(j*3,Math.random()*2,Math.random()*3);g.add(m);
 }
 g.position.set((Math.random()-.5)*220,35+Math.random()*35,-Math.random()*600);
 clouds.add(g);
}

// Rain
const rainCount=1000;
const rainGeo=new THREE.BufferGeometry();
const rainPos=new Float32Array(rainCount*3);
for(let i=0;i<rainCount;i++){
 rainPos[i*3]=(Math.random()-.5)*90;
 rainPos[i*3+1]=Math.random()*60;
 rainPos[i*3+2]=(Math.random()-.5)*130;
}
rainGeo.setAttribute('position',new THREE.BufferAttribute(rainPos,3));
const rain=new THREE.Points(rainGeo,new THREE.PointsMaterial({color:0xcceeff,size:.16,transparent:true,opacity:.7}));
scene.add(rain);rain.visible=false;

// Traffic cars
const traffic=[];
function makeTraffic(z,lane,color){
 const g=new THREE.Group();
 const paint=material(color,.35,.4);
 cube(g,0,.75,0,1.8,.8,3.5,paint);
 cube(g,0,1.35,-.25,1.5,.65,1.8,windowMat);
 for(const x of [-.9,.9])for(const zz of [-1,1]){
  const w=new THREE.Mesh(new THREE.CylinderGeometry(.35,.35,.22,16),black);
  w.rotation.z=Math.PI/2;w.position.set(x,.4,zz);g.add(w);
 }
 g.position.set(lane,0,z);scene.add(g);
 traffic.push(g);
}
for(let i=0;i<12;i++){
 makeTraffic(-35-i*48,i%2===0?-4.8:4.8,[0xc42e32,0xe0e0e0,0x242a35,0xd5a52b][i%4]);
}

// Drift smoke particles
const smoke=[];
const smokeMat=new THREE.MeshBasicMaterial({color:0xbfc6cc,transparent:true,opacity:.35,depthWrite:false});
for(let i=0;i<45;i++){
 const m=new THREE.Mesh(new THREE.SphereGeometry(.35,8,8),smokeMat.clone());
 m.visible=false;scene.add(m);smoke.push({mesh:m,life:0});
}

let speed=0,weather='sun',night=false,drift=false;
const keys={};
function hold(id,key){
 const b=document.getElementById(id);
 b.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true});
 ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[key]=false));
}
hold('gas','gas');hold('brake','brake');hold('left','left');hold('right','right');

function setWeather(type){
 weather=type;rain.visible=type==='rain';clouds.visible=type!=='sun';
 const c=type==='sun'?0x8cc9ed:type==='cloud'?0x71879a:0x35485c;
 scene.background.set(c);scene.fog.color.set(c);
 sunLight.intensity=type==='sun'?3:type==='cloud'?1.4:.8;
}
document.getElementById('sun').onclick=()=>setWeather('sun');
document.getElementById('cloud').onclick=()=>setWeather('cloud');
document.getElementById('rain').onclick=()=>setWeather('rain');
document.getElementById('night').onclick=()=>{
 night=!night;
 const c=night?0x071326:0x8cc9ed;
 scene.background.set(c);scene.fog.color.set(c);
 sunLight.intensity=night?.15:2.5;
};
document.getElementById('drift').onclick=()=>{
 drift=!drift;
 document.getElementById('drift').textContent='💨 Drift: '+(drift?'ON':'OFF');
};
document.getElementById('reset').onclick=()=>{
 car.position.set(0,0,3);car.rotation.y=0;speed=0;
};

function emitSmoke(){
 for(const p of smoke){
  if(p.life<=0){
   p.life=1;
   p.mesh.visible=true;
   p.mesh.position.set(
    car.position.x+(Math.random()-.5)*2,
    .5+Math.random()*.4,
    car.position.z+2.1
   );
   p.mesh.scale.setScalar(.5+Math.random()*.5);
   break;
  }
 }
}

const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 if(keys.gas)speed=Math.min(speed+24*dt,65);
 else speed=Math.max(0,speed-7*dt);
 if(keys.brake)speed=Math.max(0,speed-45*dt);

 const turn=(keys.left?1:0)-(keys.right?1:0);
 if(speed>1){
  const turning=turn*dt*(.85+speed/60);
  car.rotation.y+=turning*(drift?1.8:1);
  car.position.x+=Math.sin(car.rotation.y)*speed*dt*.45;
  car.position.z-=Math.cos(car.rotation.y)*speed*dt*.45;
 }
 car.position.x=THREE.MathUtils.clamp(car.position.x,-7,7);
 wheels.forEach(w=>w.rotation.x-=speed*dt*.08);

 if(drift&&Math.abs(turn)>.1&&speed>15)emitSmoke();

 for(const p of smoke){
  if(p.life>0){
   p.life-=dt;
   p.mesh.position.y+=dt*1.2;
   p.mesh.scale.multiplyScalar(1+dt*.8);
   p.mesh.material.opacity=Math.max(0,p.life*.35);
   if(p.life<=0)p.mesh.visible=false;
  }
 }

 for(const t of traffic){
  t.position.z+=dt*(8+speed*.08);
  if(t.position.z>car.position.z+35)t.position.z-=570;
 }

 const desired=new THREE.Vector3(
  car.position.x-Math.sin(car.rotation.y)*10,
  5.2,
  car.position.z+Math.cos(car.rotation.y)*10
 );
 camera.position.lerp(desired,1-Math.exp(-4*dt));
 camera.lookAt(car.position.x,1.2,car.position.z-3);

 if(rain.visible){
  for(let i=0;i<rainCount;i++){
   rainPos[i*3+1]-=35*dt;
   if(rainPos[i*3+1]<0)rainPos[i*3+1]=60;
   rainPos[i*3+2]+=speed*dt*.3;
  }
  rainGeo.attributes.position.needsUpdate=true;
 }
 document.getElementById('speed').textContent=Math.round(speed*3.6);
 renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
