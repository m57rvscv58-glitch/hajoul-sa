
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>HAJOUL WORLD 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07121d;color:white;font-family:Arial;overflow:hidden}
#hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:2;font-weight:bold;text-shadow:0 2px 5px #000}
#menu{position:absolute;bottom:12px;left:0;right:0;text-align:center;z-index:2}
button,select{padding:13px 18px;border:0;border-radius:12px;margin:4px;font-weight:bold}
button{background:#12d5ff;color:#00151e}
#controls{display:flex;justify-content:center;gap:18px}
#controls button{width:75px;height:65px;font-size:25px}
#fuel{color:#50e6a0}
</style>
</head>
<body>
<div id="hud">
<div>HAJOUL WORLD</div>
<div>Speed: <span id="speed">0</span> km/h</div>
<div>Fuel: <span id="fuel">100</span>%</div>
</div>
<div id="menu">
<select id="car">
<option>Saudi Patrol</option>
<option>Hilux</option>
<option>Sonata</option>
<option>Tesla Cybertruck</option>
<option>GT-R</option>
<option>Lamborghini</option>
</select>
<div id="controls">
<button id="left">⬅️</button>
<button id="gas">🚀</button>
<button id="right">➡️</button>
</div>
<button onclick="fuel=100">⛽ REFUEL</button>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87bce5);
scene.fog=new THREE.Fog(0x87bce5,35,150);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,300);
camera.position.set(0,5,10);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x53634b,2));
const sun=new THREE.DirectionalLight(0xffffff,3);
sun.position.set(-20,35,20);
sun.castShadow=true;
scene.add(sun);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(250,250),new THREE.MeshStandardMaterial({color:0xc1a36e}));
ground.rotation.x=-Math.PI/2;
ground.position.y=-.1;
ground.receiveShadow=true;
scene.add(ground);

const road=new THREE.Mesh(new THREE.PlaneGeometry(12,250),new THREE.MeshStandardMaterial({color:0x30343a}));
road.rotation.x=-Math.PI/2;
road.position.y=.01;
scene.add(road);

for(let z=-120;z<120;z+=12){
const line=new THREE.Mesh(new THREE.BoxGeometry(.15,.03,5),new THREE.MeshStandardMaterial({color:0xffffff}));
line.position.set(0,.04,z);
scene.add(line);
}

function building(x,z,w,h,d,color){
const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,roughness:.85}));
b.position.set(x,h/2,z);b.castShadow=true;b.receiveShadow=true;scene.add(b);
}
for(let z=-100;z<100;z+=18){
building(-15,z,7,8+Math.random()*15,8,0xc9c6bd);
building(15,z,7,10+Math.random()*17,8,0xd8d0bd);
}

const car=new THREE.Group();
scene.add(car);
const body=new THREE.Mesh(new THREE.BoxGeometry(2,0.65,4),new THREE.MeshStandardMaterial({color:0x0e9fd3,metalness:.65,roughness:.25}));
body.position.y=.85;body.castShadow=true;car.add(body);
const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.65,.75,1.8),new THREE.MeshStandardMaterial({color:0x182d3c,metalness:.4,roughness:.2}));
cabin.position.set(0,1.5,-.15);car.add(cabin);
const wheels=[];
for(const x of [-1,1])for(const z of [-1.3,1.3]){
const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.28,24),new THREE.MeshStandardMaterial({color:0x101010,roughness:.9}));
wheel.rotation.z=Math.PI/2;wheel.position.set(x,.45,z);car.add(wheel);wheels.push(wheel);
}
car.position.z=4;

let speed=0,fuel=100,steer=0,gas=false,left=false,right=false;
function hold(id,fn){
const el=document.getElementById(id);
el.addEventListener('pointerdown',e=>{e.preventDefault();fn(true)});
['pointerup','pointercancel','pointerleave'].forEach(v=>el.addEventListener(v,()=>fn(false)));
}
hold('gas',v=>gas=v);hold('left',v=>left=v);hold('right',v=>right=v);

function animate(){
requestAnimationFrame(animate);
if(gas&&fuel>0){speed=Math.min(speed+.35,160);fuel=Math.max(0,fuel-.008);}
else speed=Math.max(0,speed-.12);
steer=(right?1:0)-(left?1:0);
car.rotation.y-=steer*.018*(speed/50+.3);
car.position.x+=Math.sin(-car.rotation.y)*speed*.001;
car.position.z-=speed*.012;
if(car.position.z < -100)car.position.z=10;
wheels.forEach(w=>w.rotation.x+=speed*.015);
camera.position.lerp(new THREE.Vector3(car.position.x,car.position.y+4,car.position.z+9),.08);
camera.lookAt(car.position.x,1,car.position.z-2);
document.getElementById('speed').textContent=Math.round(speed);
document.getElementById('fuel').textContent=Math.round(fuel);
renderer.render(scene,camera);
}
animate();
addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
